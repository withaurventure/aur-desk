<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F7FB">
  <meta name="robots" content="noindex, nofollow">
  <title>AUR Desk</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <button class="tab" data-tab="home" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-tab="clients">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 4a4 4 0 0 1 0 8M22 21c0-3-1.5-5-4-5.6"/></svg>
        <span>Clients</span>
      </button>
      <button class="tab" data-tab="documents">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
        <span>Documents</span>
      </button>
      <button class="tab" data-tab="money">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><path d="M16 14h.01"/></svg>
        <span>Money</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <dialog id="switcher" class="sheet" aria-labelledby="switcher-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 id="switcher-title" class="sheet-title">Switch company</h2>
    <div id="switcher-list" class="sheet-list"></div>
    <button class="btn btn-ghost" data-close>Cancel</button>
  </dialog>

  <dialog id="confirm" class="sheet" aria-label="Confirm"></dialog>
  <dialog id="picker" class="sheet picker" aria-label="Add from rate card"></dialog>

  <div id="lock" class="lock" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
